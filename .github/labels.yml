# Catálogo de labels de dominio para el triaje automático de issues.
# Sincronizado en cada ejecución por .github/workflows/claude-issue-triage.yml
# (gh label create --force), así no requiere creación manual en GitHub.

- name: "type:bug"
  color: "d73a4a"
  description: "Comportamiento incorrecto respecto al esperado"
- name: "type:feature"
  color: "a2eeef"
  description: "Nueva funcionalidad que hoy no existe"
- name: "type:enhancement"
  color: "a2eeef"
  description: "Mejora sobre una funcionalidad ya existente"
- name: "type:docs"
  color: "0075ca"
  description: "Cambios de documentación (README, CLAUDE.md, etc.)"
- name: "type:question"
  color: "d876e3"
  description: "Pregunta o duda que no implica un cambio de código"

- name: "area:gameplay"
  color: "5319e7"
  description: "Colisión, rotación, lock, clear de líneas (board/current/next)"
- name: "area:rendering"
  color: "5319e7"
  description: "Dibujo en canvas: draw(), drawNext(), colores, ghost piece"
- name: "area:input"
  color: "5319e7"
  description: "Listener de teclado y controles"
- name: "area:ui"
  color: "5319e7"
  description: "HUD, overlay de pausa/game over, index.html, style.css"
- name: "area:scoring"
  color: "5319e7"
  description: "Puntaje, líneas, nivel, dropInterval"
- name: "area:ci"
  color: "5319e7"
  description: "Workflows de GitHub Actions y configuración en .github/"

- name: "priority:high"
  color: "b60205"
  description: "Bloquea el uso normal del juego"
- name: "priority:medium"
  color: "fbca04"
  description: "Afecta la experiencia pero tiene workaround"
- name: "priority:low"
  color: "0e8a16"
  description: "Cosmético o de bajo impacto"

- name: "needs-info"
  color: "cfd3d7"
  description: "Falta información para diagnosticar o priorizar"
- name: "triaged"
  color: "1d76db"
  description: "Ya fue analizado por el workflow de triaje automático"
